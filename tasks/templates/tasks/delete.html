<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
    crossorigin="anonymous">

<style>

    body {
        background-color: #638CB8;
        font-family: Arial, sans-serif;
    }

    .center-column {
        width: 750px;
        max-width: 90%;
        margin: 40px auto;
        padding: 25px;
        background-color: #ffffff;
        border-radius: 4px;
        box-shadow: 6px 2px 30px 0px rgba(0,0,0,0.35);
    }

    .page-title {
        text-align: center;
        background-color: #638CB8;
        color: #111;
        font-size: 30px;
        font-weight: 500;
        padding: 5px 0;
        margin-bottom: 25px;
    }

    .delete-message {
        text-align: center;
        font-size: 19px;
        color: #222;
        margin: 30px 0;
    }

    .task-name {
        font-weight: 600;
    }

    .button-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 25px;
    }

    .btn-cancel {
        background-color: #ffae19;
        border: 1px solid #e59400;
        color: white;
        padding: 10px 28px;
        border-radius: 4px;
        font-size: 16px;
        text-decoration: none;
    }

    .btn-cancel:hover {
        background-color: #e59400;
        color: white;
        text-decoration: none;
    }

    .btn-confirm {
        background-color: #18a6bc;
        border: 1px solid #18a6bc;
        color: white;
        padding: 10px 28px;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    .btn-confirm:hover {
        background-color: #128da0;
        border-color: #128da0;
    }

    .confirm-form {
        margin: 0;
    }

</style>


<div class="center-column">

    <div class="page-title">
        Delete Task
    </div>

    <p class="delete-message">
        Are you sure you want to delete
        "<span class="task-name">{{item}}</span>"?
    </p>

    <div class="button-container">

        <a class="btn-cancel"
           href="{% url 'lists' %}">
            Cancel
        </a>

        <form method="POST" action="" class="confirm-form">
            {% csrf_token %}
            <input
                type="submit"
                name="Confirm"
                value="Confirm"
                class="btn-confirm">
        </form>

    </div>

</div>
