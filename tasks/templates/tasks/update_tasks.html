<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
    crossorigin="anonymous">

<style>

    body {
        background-color: #638CB8;
        font-family: Arial, sans-serif;
    }

    input {
        width: 100%;
        padding: 12px 20px;
        margin: 8px 0;
        box-sizing: border-box;
    }

    input::placeholder {
        color: #d3d3d3;
    }

    .center-column {
        width: 750px;
        max-width: 90%;
        margin: 40px auto;
        padding: 25px;
        background-color: #ffffff;
        border-radius: 4px;
        box-shadow: 6px 2px 30px 0px rgba(0,0,0,0.35);
    }

    .page-title {
        text-align: center;
        background-color: #638CB8;
        color: #ffffff;
        font-size: 30px;
        font-weight: 500;
        padding: 6px 0;
        margin: 0 0 25px 0;
    }

    /* Django form fields */
    form p {
        margin-bottom: 18px;
    }

    form label {
        display: block;
        font-size: 16px;
        color: #222;
        margin-bottom: 6px;
    }

    form input[type="text"],
    form input[type="email"],
    form input[type="number"],
    form input[type="password"],
    form textarea,
    form select {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #b8b8b8;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
        outline: none;
    }

    form input[type="text"]:focus,
    form input[type="email"]:focus,
    form input[type="number"]:focus,
    form input[type="password"]:focus,
    form textarea:focus,
    form select:focus {
        border-color: #638CB8;
        box-shadow: 0 0 4px rgba(99, 140, 184, 0.4);
    }

    /* Update button */
    .update-btn {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 11px;
        background-color: #18a6bc;
        border: 1px solid #18a6bc;
        border-radius: 4px;
        color: #ffffff;
        font-size: 17px;
        cursor: pointer;
    }

    .update-btn:hover {
        background-color: #128da0;
        border-color: #128da0;
    }

</style>


<div class="center-column">

    <div class="page-title">
        Update Task
    </div>

    <form method="POST" action="">
        {% csrf_token %}

        {{form}}

        <input
            class="update-btn"
            type="submit"
            name="Update Task"
            value="Update Task">
    </form>

</div>
